name: FxB Pay CI

on:
  push:
    paths: ["FxBPay/**", ".github/workflows/fxbpay-ci.yml"]
  pull_request:
    paths: ["FxBPay/**", ".github/workflows/fxbpay-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FxBPay
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fxb
          POSTGRES_PASSWORD: fxb
          POSTGRES_DB: fxbpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fxb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fxb:fxb@localhost:5432/fxbpay_test
      DATABASE_URL: postgres://fxb:fxb@localhost:5432/fxbpay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FxBPay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
