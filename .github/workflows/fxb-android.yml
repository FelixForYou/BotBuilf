# Build APK Android "FxB RestApi" (folder fxb_restapi_app/).
#
# Berjalan otomatis saat ada push yang mengubah fxb_restapi_app/**, atau manual
# lewat "Run workflow" (dari branch default).
#
# Domain backend: variabel repository FXB_BASE_URL (Settings → Secrets and variables
# → Actions → Variables). Kosong = https://api.felixiority.xyz (lib/config/app_config.dart).
#
# Penandatanganan (opsional, untuk keystore produksi) — isi Secrets:
#   FXB_KEYSTORE_BASE64   base64 dari file .jks
#   FXB_KEYSTORE_PASSWORD
#   FXB_KEY_ALIAS
#   FXB_KEY_PASSWORD
# Tanpa secrets ini APK ditandatangani dengan debug key (hanya untuk uji coba).
#
# Hasil: artifact "fxb-restapi-apk" + GitHub Release prerelease berisi APK & ZIP source.
# Jika pesan commit mengandung [apk], APK juga di-commit ke fxb_restapi_app/dist/.
name: FxB RestApi Android APK

on:
  push:
    paths:
      - "fxb_restapi_app/**"
      - ".github/workflows/fxb-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fxb-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip apk]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fxb_restapi_app
    env:
      FXB_BASE_URL: ${{ vars.FXB_BASE_URL || 'https://api.felixiority.xyz' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dependensi
        run: flutter pub get

      - name: Format, analyze, test
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Keystore produksi (bila secrets tersedia)
        env:
          KS_B64: ${{ secrets.FXB_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.FXB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FXB_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FXB_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/fxb-release.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD/android/fxb-release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
            echo "SIGNING=release-keystore" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
          fi

      - name: Build APK release
        run: |
          flutter build apk --release --dart-define=FXB_BASE_URL="$FXB_BASE_URL"
          flutter build apk --release --split-per-abi --dart-define=FXB_BASE_URL="$FXB_BASE_URL"

      - name: Kumpulkan hasil
        run: |
          mkdir -p ../out
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "../out/FxB-RestApi-v${V}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../out/FxB-RestApi-v${V}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../out/FxB-RestApi-v${V}-armeabi-v7a.apk"
          (cd .. && git archive --format=zip --prefix=fxb_restapi_app/ -o "out/FxB-RestApi-flutter-source-v${V}.zip" HEAD:fxb_restapi_app)
          (cd ../out && sha256sum * > SHA256SUMS.txt)
          {
            echo "Backend: $FXB_BASE_URL"
            echo "Signing: $SIGNING"
            echo "Commit: $GITHUB_SHA"
            echo "Flutter: $(flutter --version | head -1)"
          } > ../out/BUILD-INFO.txt
          ls -la ../out
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: fxb-restapi-apk
          path: out/*
          retention-days: 30

      - name: GitHub Release (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: out
        run: |
          TAG="fxb-restapi-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "FxB RestApi ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK Android FxB RestApi. Backend: ${FXB_BASE_URL}. Penandatanganan: ${SIGNING}. Lihat fxb_restapi_app/README.md."

      - name: Commit APK ke branch (bila pesan commit berisi [apk])
        if: ${{ contains(github.event.head_commit.message, '[apk]') }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p fxb_restapi_app/dist
          rm -f fxb_restapi_app/dist/*
          cp out/*.apk out/SHA256SUMS.txt out/BUILD-INFO.txt fxb_restapi_app/dist/
          git add -f fxb_restapi_app/dist
          git commit -m "Tambah APK FxB RestApi build ${GITHUB_RUN_NUMBER} [skip apk]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
